[project]
name = "kanji-app"
version = "0.1.0"
description = "A desktop spaced-repetition app for learning Japanese kanji"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "fsrs>=5.0",
]

[project.scripts]
kanji-app = "kanji_app.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kanji_app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["kanji_app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["kanji_app", "tests"]

[[tool.mypy.overrides]]
module = ["fsrs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
